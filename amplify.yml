version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Write NEXT_PUBLIC_ vars to .env so Next.js bakes them into the client bundle. All others are secret.
        - echo "NEXT_PUBLIC_PRIVY_APP_ID=$NEXT_PUBLIC_PRIVY_APP_ID" >> .env
        - python3 -c "import json,os; s=json.loads(os.environ['secrets']); keys=['PRIVY_APP_SECRET','PRIVY_AUTHORIZATION_KEY_ID','PRIVY_AUTHORIZATION_POLICY_ID','SUPABASE_SERVICE_KEY','SUPABASE_URL','NEYNAR_API_KEY','FARCASTER_APP_MNEMONIC','OPTIMISM_RPC_URL']; [print(f'{k}={s[k]}') for k in keys if k in s]" >> .env
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
