version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Write NEXT_PUBLIC_ vars to .env so Next.js bakes them into the client bundle. All others are secret.
        - echo "NEXT_PUBLIC_PRIVY_APP_ID=$NEXT_PUBLIC_PRIVY_APP_ID" >> .env
        - echo "PRIVY_APP_SECRET=$PRIVY_APP_SECRET" >> .env
        - echo "PRIVY_AUTHORIZATION_KEY_ID=$PRIVY_AUTHORIZATION_KEY_ID" >> .env
        - echo "PRIVY_AUTHORIZATION_POLICY_ID=$PRIVY_AUTHORIZATION_POLICY_ID" >> .env
        - echo "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY" >> .env
        - echo "SUPABASE_URL=$SUPABASE_URL" >> .env
        - echo $secrets
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
